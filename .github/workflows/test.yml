name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q beal_lab search.py tests
      - name: Verify baseline certificate
        run: python -m beal_lab.verify certificates/baseline-20-5.json
